<!doctype html>
<html><head><meta charset="utf-8"><title>Reply rating</title>
<style>
:root{--bg:#101216;--fg:#e8eaed;--dim:#9aa0a6;--line:#2a2e35;--acc:#60a5fa;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;display:flex}
#main{flex:1;padding:24px 28px;max-width:840px}
#side{width:400px;border-left:1px solid var(--line);padding:18px 20px;height:100vh;overflow:auto;
      font-size:12.5px;color:var(--dim);white-space:pre-wrap}
#bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:18px}
#bar>div{height:100%;background:var(--acc);border-radius:2px;transition:width .15s}
.meta{color:var(--dim);font-size:12px;display:flex;gap:16px;margin-bottom:10px}
.box{padding:14px 18px;border-radius:6px;white-space:pre-wrap;margin-bottom:12px}
#msg{background:#171a1f;border:1px solid var(--line);border-left:3px solid #6b7280;font-size:16px}
#cand{background:#141b26;border:1px solid #24344a;border-left:3px solid var(--acc);font-size:18px}
h4{margin:16px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.dim{margin-bottom:10px;padding:8px 10px;border-radius:5px;border:1px solid transparent}
.dim.active{border-color:var(--acc);background:#131a24}
.dim .lbl{font-size:13px;color:var(--fg);margin-bottom:4px}
.scale{display:flex;gap:6px}
.sc{padding:4px 12px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:13px}
.sc:hover{border-color:var(--acc)}
.sc.sel{background:#1d2b3d;border-color:var(--acc);color:var(--acc)}
kbd{background:#22262d;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:1px 6px;font:12px ui-monospace,monospace}
button{background:#22262d;color:var(--fg);border:1px solid var(--line);border-radius:5px;
       padding:7px 14px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--acc)}
#hud{position:fixed;bottom:0;left:0;right:400px;background:#0b0d10;border-top:1px solid var(--line);
     padding:9px 28px;font-size:12px;color:var(--dim);display:flex;gap:20px}
</style></head><body>
<div id="main">
  <div id="bar"><div style="width:0"></div></div>
  <div class="meta"><span id="pos"></span><span id="done"></span><span id="saved" style="color:#6ee7a8"></span>
    <span id="nostore" hidden style="color:var(--warn)">no browser storage &mdash; auto-exporting every 15 ratings</span></div>
  <h4>customer wrote</h4>
  <div id="msg" class="box"></div>
  <h4>draft reply to grade</h4>
  <div id="cand" class="box"></div>
  <div id="dims"></div>
  <div style="margin:20px 0 60px;display:flex;gap:10px">
    <button onclick="prev()">&larr; back</button>
    <button onclick="next()">skip &rarr;</button>
    <button onclick="exportJSON()" style="border-color:var(--acc);color:var(--acc)">export JSON</button>
  </div>
</div>
<div id="side"><h4 style="margin-top:0">rubric</h4><div id="rubric"></div></div>
<div id="hud">
  <span><kbd>1</kbd>&ndash;<kbd>5</kbd> score the highlighted line</span>
  <span>usable: <kbd>0</kbd> no &middot; <kbd>1</kbd> yes</span>
  <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> navigate</span>
</div>
<script>
const ITEMS = [{"rating_id": "hulu_support-2617198::majority", "case_id": "hulu_support-2617198", "customer_opening": "@user Can you add Avatar, the last airbender to the website/subscription? I'm trying to catch up with my boy Aang and Szucko.", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-2512348::agent", "case_id": "hulu_support-2512348", "customer_opening": "@user hi looking to buy a gift card for my mom. Can you help?", "reply": "Sure thing! You can purchase gift cards at the participating retailers listed here: <URL> 👍🏻", "system": null}, {"rating_id": "hulu_support-2736129::agent", "case_id": "hulu_support-2736129", "customer_opening": "@user could you all bring back this show season 1-6 <URL>", "reply": "@user Hi there! We don’t have the rights to that show right now. We’ll pass your request along to our content team. 👍", "system": null}, {"rating_id": "hulu_support-2683235::agent", "case_id": "hulu_support-2683235", "customer_opening": "@user Where is divorce court s.19 ep 41?", "reply": "@user Sorry to hear that! We’ve let our content team know you’re looking for Divorce Court S19E41. 🙏", "system": null}, {"rating_id": "hulu_support-486309::majority", "case_id": "hulu_support-486309", "customer_opening": "@user I can’t seem to figure out how to get to a Series page in the new app. It’s not very user friendly.", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-2617198::keyword_knn", "case_id": "hulu_support-2617198", "customer_opening": "@user Can you add Avatar, the last airbender to the website/subscription? I'm trying to catch up with my boy Aang and Szucko.", "reply": "@user Hi, Aaron! We don't have any info to provide about future availability, but we've shared your request with our content team. 💙", "system": null}, {"rating_id": "hulu_support-175258::majority", "case_id": "hulu_support-175258", "customer_opening": "@user why y’all only got 100 episode of Naruto Shippiden in dub anime and not the other 400? Questions that needs answer ASAP! Before I cancel my account smh.", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-2683235::majority", "case_id": "hulu_support-2683235", "customer_opening": "@user Where is divorce court s.19 ep 41?", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-2740542::keyword_knn", "case_id": "hulu_support-2740542", "customer_opening": "why do neither netflix or hulu have ponyo when i’m in the mood to watch it :((", "reply": "@user Hi, William. We do offer Hulu gift cards at many retails and grocery stores! For more details, see: <URL>", "system": null}, {"rating_id": "hulu_support-523886::majority", "case_id": "hulu_support-523886", "customer_opening": "Person on the @user chat tried it. I read the terms and conditions!! @user you better get them folks. Messing with y’all name like that", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-654038::majority", "case_id": "hulu_support-654038", "customer_opening": "When is @user season 2 gonna be on @user", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-2792509::keyword_knn", "case_id": "hulu_support-2792509", "customer_opening": "@user I cancelled my subscription and I should have until 12/20 for services to stop yet I can’t even log in", "reply": "@user We'd love to take a closer look at this on our end, Quincy! Call/chat so we can pull up your info: <URL>", "system": null}, {"rating_id": "hulu_support-654038::keyword_knn", "case_id": "hulu_su <URL>", "system": null}, {"rating_id": "hulu_support-488625::keyword_knn", "case_id": "hulu_support-488625", "customer_opening": ".@user Does your company have any idea how many subscribers it's missing out on by not offering surround sound? You are so far behind the curve, Netflix has lapped you, twice", "reply": "@user Hey there! We don't have any news yet but we are looking into surround sound formatting. Thanks for following up with the interest!", "system": null}, {"rating_id": "hulu_support-2736129::keyword_knn", "case_id": "hulu_support-2736129", "customer_opening": "@user could you all bring back this show season 1-6 <URL>", "reply": "@user We only have the rights for the current season, but we'll absolutely express your interest in seeing season 1 return.", "system": null}, {"rating_id": "hulu_support-2740542::majority", "case_id": "hulu_support-2740542", "customer_opening": "why do neither netflix or hulu have ponyo when i’m in the mood to watch it :((", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-113525::agent", "case_id": "hulu_support-113525", "customer_opening": "@user please stop your programming from auto playing after backing out on Apple TV! I’m about to cancel due to this issue where I don’t want to keep watching, &amp; it won’t back out, without a stop button. I wish you wouldn’t have updated your GUI/HUD or whatever you are calling it!", "reply": "Sorry to hear that! Autoplay is designed to keep playing episodes, but we’ll share your feedback with the team.", "system": null}, {"rating_id": "hulu_support-2617198::agent", "case_id": "hulu_support-2617198", "customer_opening": "@user Can you add Avatar, the last airbender to the website/subscription? I'm trying to catch up with my boy Aang and Szucko.", "reply": "Oh no! We don’t have info on future availability, but we’ve shared your request with our content team. 💙", "system": null}, {"rating_id": "hulu_support-2970408::keyword_knn", "case_id": "hulu_support-2970408", "customer_opening": "Nice update to your Amazon Firestick app @user. I’m looking at a black screen with the ABC logo in the bottom right corner instead of my TV show.", "reply": "@user We'd be happy to help you out here, Eric. Just follow these steps: <URL> to update your current version. 👍", "system": null}, {"rating_id": "hulu_support-486309::keyword_knn", "case_id": "hulu_support-486309", "customer_opening": "@user I can’t seem to figure out how to get to a Series page in the new app. It’s not very user friendly.", "reply": "@user We're sorry to hear this—we'll share your feedback with our team! Be sure to check out: <URL> if you haven't!", "system": null}, {"rating_id": "hulu_support-2740542::agent", "case_id": "hulu_support-2740542", "customer_opening": "why do neither netflix or hulu have ponyo when i’m in the mood to watch it :((", "reply": "Sorry to hear that! Unfortunately we don’t have Ponyo in our catalog right now. You can let us know you’d like it via the feedback form: <URL>", "system": null}, {"rating_id": "hulu_support-2792509::majority", "case_id": "hulu_support-2792509", "customer_opening": "@user I cancelled my subscription and I should have until 12/20 for services to stop yet I can’t even log in", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-2512348::keyword_knn", "case_id": "hulu_support-2512348", "customer_opening": "@user hi looking to buy a gift card for my mom. Can you help?", "reply": "@user Hey there! You can purchase gift cards at the participating retailers listed here: <URL> 👍🏻", "system": null}, {"rating_id": "hulu_support-2970408::majority", "case_id": "hulu_support-2970408", "customer_opening": "Nice update to your Amazon Firestick app @user. I’m looking at a black screen with the ABC logo in the bottom right corner instead of my TV show.", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-488625::agent", "case_id": "hulu_support-488625", "customer_opening": ".@user Does your company have any idea how many subscribers it's missing out on by not offering surround sound? You are so far behind the curve, Netflix has lapped you, twice", "reply": "Hey there! Thanks for the feedback – we’ll pass your surround‑sound request along to the team.", "system": null}, {"rating_id": "hulu_support-2736129::majority", "case_id": "hulu_support-2736129", "customer_opening": "@user could you all bring back this show season 1-6 <URL>", "reply": "Oh no! Sorry for the trouble. What device are you using? Let us know and we'll take a look.", "system": null}, {"rating_id": "hulu_support-2683235::keyword_knn", "case_id": "hulu_support-2683235", "customer_opening": "@user Where is divorce court s.19 ep 41?", "reply": "@user Hello there! Sorry for the delay. We've let our content team know that you're ready for more seasons of Divorce Court! ✅", "system": null}, {"rating_id": "hulu_support-654038::agent", "case_id": "hulu_support-654038", "customer_opening": "When is @user season 2 gonna be on @user", "reply": "@user Hi! We don’t have a release date for season 2 yet. Add the show to My Stuff to get notified when it arrives. 👍", "system": null}, {"rating_id": "hulu_support-2970408::agent", "case_id": "hulu_support-2970408", "customer_opening": "Nice update to your Amazon Firestick app @user. I’m looking at a black screen with the ABC logo in the bottom right corner instead of my TV show.", "reply": "Oh no! Try clearing the Hulu app cache or reinstalling it on your Firestick. That often fixes black‑screen issues. Let us know if it still happens.", "system": null}, {"rating_id": "hulu_support-175258::keyword_knn", "case_id": "hulu_support-175258", "customer_opening": "@user why y’all only got 100 episode of Naruto Shippiden in dub anime and not the other 400? Questions that needs answer ASAP! Before I cancel my account smh.", "reply": "@user Hey there! We only have the rights to stream select dubbed episodes at this time, but we'll share your request with our team.", "system": null}, {"rating_id": "hulu_support-523886::agent", "case_id": "hulu_support-523886", "customer_opening": "Person on the @user chat tried it. I read the terms and conditions!! @user you better get them folks. Messing with y’all name like that", "reply": "Sorry to hear that. Could you DM us more details so we can look into it? 🙏", "system": null}, {"rating_id": "hulu_support-175258::agent", "case_id": "hulu_support-175258", "customer_opening": "@user why y’all only got 100 episode of Naruto Shippiden in dub anime and not the other 400? Questions that needs answer ASAP! Before I cancel my account smh.", "reply": "@user Sorry to hear that! We only have rights to select dubbed episodes of Naruto Shippuden. We’ll pass your request along—feel free to DM us for any help.", "system": null}], RUBRIC = "grounded (1-5): does the advice match how this brand has actually handled this\n  problem, judged against the past cases shown?\n  1 = invents a step, policy, price or date that contradicts or is absent from the past cases\n  3 = broadly plausible and brand-consistent but not clearly supported by any past case\n  5 = the step or question is one the brand demonstrably uses for this problem\n\nactionable (1-5): does it move the case forward?\n  1 = pure acknowledgement, nothing for the customer to do or answer\n  3 = a step or question that is relevant but vague, or several at once\n  5 = exactly one concrete step, or the one diagnostic question that unblocks the next step\n\nsafe (1-5): does it avoid commitments the brand cannot keep on a public channel?\n  1 = promises a refund, a release date, an outage fix, or claims to have looked at the account\n  3 = hedged but still implies something it cannot guarantee\n  5 = makes no promise it cannot keep and claims no account access\n\nvoice (1-5): does it read like this brand's support account?\n  1 = generic corporate support boilerplate, or the wrong register entirely\n  3 = polite and inoffensive but could be any company\n  5 = the brand's own warmth and rhythm, brief, at most one emoji\n\nusable (0 or 1): would you post this unedited?\n  0 = too long for a tweet, contains a placeholder like <URL>, addresses the wrong\n      person by name, is empty, or is otherwise not postable as written\n  1 = postable exactly as written";
const DIMS = ["grounded","actionable","safe","voice","usable"];
const LABELS = {grounded:"grounded in how the brand actually handles this",
                actionable:"moves the case forward",
                safe:"promises nothing it cannot keep",
                voice:"sounds like this brand",
                usable:"would you post this unedited?"};
const KEY = "reply_ratings_v1";
let STORAGE_OK = true;
function store(k,v){ try{ localStorage.setItem(k,v);}catch(e){ STORAGE_OK=false; } }
function loadS(k){ try{ return localStorage.getItem(k);}catch(e){ STORAGE_OK=false; return null; } }
let ratings = JSON.parse(loadS(KEY) || "{}");
let i = 0, d = 0, sinceBackup = 0;

function cur(){ return ITEMS[i]; }
function rec(){ const k = cur().rating_id; return ratings[k] || (ratings[k] = {rating_id:k, case_id:cur().case_id, system:cur().system}); }
function complete(r){ return DIMS.every(x => r && r[x] !== undefined); }
function save(){ persist(ITEMS.map(c=>({...(ratings[c.rating_id]||{rating_id:c.rating_id,case_id:c.case_id,system:c.system})})), 'reply_ratings.jsonl'); store(KEY, JSON.stringify(ratings));
  if(!STORAGE_OK && ++sinceBackup >= 15){ sinceBackup = 0; exportJSON(true); } }

function render(){
  const c = cur(), r = ratings[c.rating_id] || {};
  const n = Object.values(ratings).filter(complete).length;
  document.querySelector("#bar>div").style.width = (100*n/ITEMS.length)+"%";
  document.getElementById("pos").textContent = `reply ${i+1} / ${ITEMS.length}`;
  document.getElementById("done").textContent = `${n} complete`;
  document.getElementById("nostore").hidden = STORAGE_OK;
  document.getElementById("msg").textContent = c.customer_opening;
  document.getElementById("cand").textContent = c.reply || "(empty reply)";
  document.getElementById("dims").innerHTML = DIMS.map((dim,n2)=>{
    const opts = dim==="usable" ? [0,1] : [1,2,3,4,5];
    return `<div class="dim ${n2===d?'active':''}"><div class="lbl">${dim} &mdash; ${LABELS[dim]}</div>
      <div class="scale">${opts.map(o=>
        `<div class="sc ${r[dim]===o?'sel':''}" onclick="setScore('${dim}',${o})">${o}</div>`).join("")}</div></div>`;
  }).join("");
  window.scrollTo(0,0);
}
function setScore(dim, val){
  const r = rec(); r[dim] = val; r.t = Date.now(); save();
  const at = DIMS.indexOf(dim);
  if(at === DIMS.length-1){ d = 0; render(); next(); }
  else { d = at+1; render(); }
}
function next(){ if(i<ITEMS.length-1){ i++; d=0; render(); } else { alert("End. Export when ready."); } }
function prev(){ if(i>0){ i--; d=0; render(); } }
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key;
  if(k==="ArrowRight"){ next(); return; } if(k==="ArrowLeft"){ prev(); return; }
  const dim = DIMS[d];
  if(dim==="usable" && /^[01]$/.test(k)){ setScore(dim, +k); return; }
  if(dim!=="usable" && /^[1-5]$/.test(k)){ setScore(dim, +k); }
});

// Persist to disk through the server after every change. localStorage is kept as
// a second copy, but the file on disk is the one that matters and it is always
// current, so an hour of work no longer depends on remembering to export.
let saveTimer = null, lastSaved = 0;
function persist(rows, filename){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    fetch("/save", {method:"POST", headers:{"Content-Type":"application/json"},
                    body: JSON.stringify({file: filename, rows: rows})})
      .then(r=>r.json())
      .then(d=>{ lastSaved = d.complete;
                 const el=document.getElementById("saved");
                 if(el) el.textContent = `${d.complete} saved to disk`; })
      .catch(()=>{ const el=document.getElementById("saved");
                   if(el) el.textContent = "NOT SAVING - is label_server.py running?"; });
  }, 400);
}

function exportJSON(auto){
  if(!auto && lastSaved === 0 && !confirm('Nothing is labelled yet. Export an empty file anyway?')) return;
  const rows = ITEMS.map(c=>({...(ratings[c.rating_id]||{rating_id:c.rating_id,case_id:c.case_id,system:c.system})}));
  const blob = new Blob([rows.map(r=>JSON.stringify(r)).join("\n")], {type:"application/x-ndjson"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = auto ? "reply_ratings_autosave.jsonl" : "reply_ratings.jsonl"; a.click();
}
document.getElementById("rubric").textContent = RUBRIC;
render();
</script></body></html>
