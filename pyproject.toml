[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "Intent classification, grounded reply drafting and escalation triage for a single brand's Twitter support stream."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
