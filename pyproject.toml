[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "Intent classification, grounded reply drafting and escalation triage for a single brand's Twitter support stream."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rank-bm25>=0.2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F,W standard; B catches real bugs like a bare zip truncating silently;
# SIM and RET keep the control flow readable, which matters because this code
# is meant to be explained out loud.
select = ["E", "F", "W", "B", "SIM", "RET"]
# The labelling pages embed HTML and JS in string literals where breaking a
# line would break the markup.
# The labelling pages embed HTML and JS in string literals where breaking a line
# would break the markup. E402 is unavoidable wherever sys.path has to be set
# before the package can be imported.
[tool.ruff.lint.per-file-ignores]
"scripts/04_make_labeller.py" = ["E501"]
"scripts/07_make_rater.py" = ["E501"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
